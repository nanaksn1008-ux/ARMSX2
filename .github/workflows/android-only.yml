name: Android Only

on:
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK + CMake
        run: yes | sdkmanager "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null || true

      - name: Fetch shaderc third-party deps
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Build release APK
        run: ./gradlew :app:assemblePlayRelease -Parmsx2.applicationId=com.budokai3.game "-Parmsx2.appLabel=DBZ Budokai 3" --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: armsx2-android-arm64
          path: platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
